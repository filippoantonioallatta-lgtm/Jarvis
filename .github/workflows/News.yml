name: JARVIS Nachrichten

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Nachrichten abrufen
        run: |
          python3 <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timezone

          url = "https://www.tagesschau.de/xml/rss2/"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as r:
              root = ET.fromstring(r.read())

          articles = []

          for item in root.findall(".//item")[:20]:
              articles.append({
                  "title": item.findtext("title", ""),
                  "uri": item.findtext("link", ""),
                  "text": item.findtext("description", ""),
                  "date": item.findtext("pubDate", "")
              })

          if not articles:
              raise RuntimeError("Keine Nachrichten gefunden")

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump({
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "articles": articles
              }, f, ensure_ascii=False, indent=2)
          PY

      - name: Nachrichten speichern
        run: |
          git config user.name "JARVIS"
          git config user.email "jarvis@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Nachrichten aktualisiert"
          git push
