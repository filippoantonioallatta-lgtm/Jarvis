<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JARVIS Audiotest</title>
</head>
<body>

<h1>JARVIS Audiotest</h1>

<button id="start">Mikrofon starten</button>
<button id="talk" disabled>Teststimme</button>
<button id="stop" disabled>Beenden</button>

<p id="info">Bereit</p>
<meter id="level" min="0" max="100" value="0"></meter>

<script>
const start = document.getElementById("start");
const talk = document.getElementById("talk");
const stop = document.getElementById("stop");
const info = document.getElementById("info");
const level = document.getElementById("level");

let stream, ctx, frame, source, analyser;

function cleanup() {
    cancelAnimationFrame(frame);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close().catch(() => {});
    if (window.speechSynthesis) speechSynthesis.cancel();
    start.disabled = false;
    talk.disabled = stop.disabled = true;
    level.value = 0;
}

start.onclick = async () => {
    start.disabled = true;

    try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        await ctx.resume();

        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true
            }
        });

        source = ctx.createMediaStreamSource(stream);
        analyser = ctx.createAnalyser();
        source.connect(analyser);

        const samples = new Float32Array(analyser.fftSize);

        function update() {
            analyser.getFloatTimeDomainData(samples);

            const rms = Math.sqrt(
                samples.reduce((s, x) => s + x*x, 0) / samples.length
            );

            level.value = Math.min(100, rms * 500);

            info.textContent =
                "Mikrofon: " + Math.round(level.value) +
                " / 100 | Audio: " + ctx.state;

            frame = requestAnimationFrame(update);
        }

        talk.disabled = stop.disabled = false;
        update();

    } catch (e) {
        cleanup();
        info.textContent = e.name + ": " + e.message;
    }
};

talk.onclick = () => {
    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(
        "Dies ist ein Audiotest. Sprich jetzt gleichzeitig mit mir. Ich werde noch einige Sekunden weitersprechen."
    );

    voice.lang = "de-DE";
    const oscillator = ctx.createOscillator();
const gain = ctx.createGain();




oscillator.type = "sine";
oscillator.frequency.value = 440;
gain.gain.value = 0.05;




oscillator.connect(gain);
gain.connect(ctx.destination);




oscillator.start();
oscillator.stop(ctx.currentTime + 8);
};

stop.onclick = () => {
    cleanup();
    info.textContent = "Beendet";
};
const recordButton = document.createElement("button");
recordButton.textContent = "Aufnahme starten";




const player = document.createElement("audio");
player.controls = true;




document.body.append(recordButton, player);




let recorder;
let audioURL;




recordButton.onclick = () => {
    if (recorder?.state === "recording") {
        recorder.stop();
        return;
    }




    if (!stream?.getAudioTracks().some(t => t.readyState === "live")) {
        alert("Bitte zuerst das Mikrofon starten.");
        return;
    }




    try {
        const chunks = [];
        recorder = new MediaRecorder(stream);




        recorder.ondataavailable = e => {
            if (e.data.size) chunks.push(e.data);
        };




        recorder.onstop = () => {
            if (audioURL) URL.revokeObjectURL(audioURL);




            audioURL = URL.createObjectURL(new Blob(chunks, {
                type: recorder.mimeType || chunks[0]?.type || ""
            }));




            player.src = audioURL;
            recordButton.textContent = "Aufnahme starten";
        };




        recorder.start();
        recordButton.textContent = "Aufnahme beenden";




    } catch (e) {
        alert(e.message);
    }
};
</script>

</body>
</html>
