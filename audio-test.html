<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JARVIS Audiotest</title>
</head>
<body>

<h1>JARVIS Audiotest</h1>

<button id="start">Mikrofon starten</button>
<button id="talk" disabled>Teststimme</button>
<button id="stop" disabled>Beenden</button>

<p id="info">Bereit</p>
<meter id="level" min="0" max="100" value="0"></meter>

<script>
const start = document.getElementById("start");
const talk = document.getElementById("talk");
const stop = document.getElementById("stop");
const info = document.getElementById("info");
const level = document.getElementById("level");

let stream, ctx, frame, source, analyser;

function cleanup() {
    cancelAnimationFrame(frame);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close().catch(() => {});
    if (window.speechSynthesis) speechSynthesis.cancel();
    start.disabled = false;
    talk.disabled = stop.disabled = true;
    level.value = 0;
}

start.onclick = async () => {
    start.disabled = true;

    try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        await ctx.resume();

        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true
            }
        });

        source = ctx.createMediaStreamSource(stream);
        analyser = ctx.createAnalyser();
        source.connect(analyser);

        const samples = new Float32Array(analyser.fftSize);

        function update() {
            analyser.getFloatTimeDomainData(samples);

            const rms = Math.sqrt(
                samples.reduce((s, x) => s + x*x, 0) / samples.length
            );

            level.value = Math.min(100, rms * 500);

            info.textContent =
                "Mikrofon: " + Math.round(level.value) +
                " / 100 | Audio: " + ctx.state;

            frame = requestAnimationFrame(update);
        }

        talk.disabled = stop.disabled = false;
        update();

    } catch (e) {
        cleanup();
        info.textContent = e.name + ": " + e.message;
    }
};

talk.onclick = () => {
    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(
        "Dies ist ein Audiotest. Sprich jetzt gleichzeitig mit mir. Ich werde noch einige Sekunden weitersprechen."
    );

    voice.lang = "de-DE";
    const oscillator = ctx.createOscillator();
const gain = ctx.createGain();




oscillator.type = "sine";
oscillator.frequency.value = 440;
gain.gain.value = 0.05;




oscillator.connect(gain);
gain.connect(ctx.destination);




oscillator.start();
oscillator.stop(ctx.currentTime + 8);
};

stop.onclick = () => {
    cleanup();
    info.textContent = "Beendet";
};
const recordButton = document.createElement("button");
recordButton.textContent = "Aufnahme starten";




const player = document.createElement("audio");
player.controls = true;




document.body.append(recordButton, player);




let recorder;
let audioURL;




recordButton.onclick = () => {
    if (recorder?.state === "recording") {
        recorder.stop();
        return;
    }




    if (!stream?.getAudioTracks().some(t => t.readyState === "live")) {
        alert("Bitte zuerst das Mikrofon starten.");
        return;
    }




    try {
        const chunks = [];
        recorder = new MediaRecorder(stream);




        recorder.ondataavailable = e => {
            if (e.data.size) chunks.push(e.data);
        };




        recorder.onstop = () => {
            if (audioURL) URL.revokeObjectURL(audioURL);




            audioURL = URL.createObjectURL(new Blob(chunks, {
                type: recorder.mimeType || chunks[0]?.type || ""
            }));




            player.src = audioURL;
            recordButton.textContent = "Aufnahme starten";
        };




        recorder.start();
        recordButton.textContent = "Aufnahme beenden";




    } catch (e) {
        alert(e.message);
    }
};
const transcribeButton = document.createElement("button");
transcribeButton.textContent = "Aufnahme in Text umwandeln";




const transcript = document.createElement("p");
document.body.append(transcribeButton, transcript);




transcribeButton.onclick = async () => {
    if (!audioURL) {
        transcript.textContent = "Bitte zuerst eine Aufnahme erstellen.";
        return;
    }




    const code = localStorage.getItem("jarvis_access_code") ||
        prompt("Bitte JARVIS-Zugangscode eingeben.");




    if (!code) return;




    transcribeButton.disabled = true;
    transcript.textContent = "Spracherkennung läuft...";




    try {
        const blob = await (await fetch(audioURL)).blob();




        const extension = blob.type.includes("webm") ? "webm" :
            blob.type.includes("ogg") ? "ogg" :
            blob.type.includes("wav") ? "wav" : "m4a";




        const form = new FormData();
        form.append("file", blob, "aufnahme." + extension);




        const result = await fetch(
            "https://jarvis-api.filippoantonioallatta.workers.dev/transcribe",
            {
                method: "POST",
                headers: {
                    "X-Jarvis-Code": code.trim()
                },
                body: form
            }
        );




        const data = await result.json();




        if (!result.ok) {
            throw new Error("HTTP " + result.status + ": " + (data.error || "Unbekannter Fehler"));
        }




        transcript.textContent = data.text || "Keine Sprache erkannt.";




    } catch (error) {
        transcript.textContent = "Fehler: " + error.message;
    } finally {
        transcribeButton.disabled = false;
    }
};
const pauseTest = document.createElement("button");
pauseTest.textContent = "Unterbrechung testen";




const pauseInfo = document.createElement("p");
document.body.append(pauseTest, pauseInfo);




let pauseTimer = null;




function endPauseTest() {
    clearInterval(pauseTimer);
    pauseTimer = null;
    pauseTest.textContent = "Unterbrechung testen";
}




pauseTest.onclick = async () => {
    const player = ttsPlayer;
    if (pauseTimer !== null) {
        endPauseTest();
        player.pause();
        return;
    }




    if (!ttsURL || !stream?.getAudioTracks().some(t => t.readyState === "live")) {
        pauseInfo.textContent = "Mikrofon und Aufnahme erforderlich.";
        return;
    }




    let paused = false;
    let loudSince = null;
    let quietSince = null;




    try {
        player.currentTime = 0;
        await player.play();
    } catch (error) {
        pauseInfo.textContent = error.message;
        return;
    }




    pauseTest.textContent = "Test beenden";




    pauseTimer = setInterval(() => {
        if (player.ended || !stream.getAudioTracks().some(t => t.readyState === "live")) {
            endPauseTest();
            player.pause();
            return;
        }




        const now = performance.now();
        const loud = level.value >= 15;




        if (loud) {
            quietSince = null;




            if (loudSince === null) loudSince = now;




            if (!paused && !player.paused && now - loudSince >= 150) {
                player.pause();
                paused = true;
                pauseInfo.textContent = "PAUSE – ich höre zu";
            }
        } else {
            loudSince = null;




            if (quietSince === null) quietSince = now;




            if (paused && now - quietSince >= 1200) {
                paused = false;




                player.play().then(() => {
                    pauseInfo.textContent = "Wiedergabe läuft weiter";
                }).catch(error => {
                    endPauseTest();
                    pauseInfo.textContent = error.message;
                });
            }
        }
    }, 50);
};
const ttsButton = document.createElement("button");
ttsButton.textContent = "JARVIS-Stimme erzeugen";




const ttsInfo = document.createElement("p");
const ttsPlayer = document.createElement("audio");
ttsPlayer.controls = true;




document.body.append(ttsButton, ttsInfo, ttsPlayer);




let ttsURL;




ttsButton.onclick = async () => {
    const code = localStorage.getItem("jarvis_access_code") ||
        prompt("Bitte JARVIS-Zugangscode eingeben.");




    if (!code) return;




    ttsButton.disabled = true;
    ttsInfo.textContent = "Stimme wird erzeugt...";




    try {
        const result = await fetch(
            "https://jarvis-api.filippoantonioallatta.workers.dev/tts",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Jarvis-Code": code.trim()
                },
                body: JSON.stringify({
                    text: "Guten Tag. Ich bin JARVIS. Meine neue Stimme ist bereit."
                })
            }
        );




        const data = await result.json();




        if (!result.ok || !data.audio) {
            throw new Error("HTTP " + result.status + ": " + (data.error || "Keine Audiodaten"));
        }




        const bytes = Uint8Array.from(
            atob(data.audio), c => c.charCodeAt(0)
        );




        const blob = new Blob([bytes], {
            type: data.mimeType || "audio/wav"
        });




        if (ttsURL) URL.revokeObjectURL(ttsURL);




        ttsURL = URL.createObjectURL(blob);
        ttsPlayer.src = ttsURL;




        ttsInfo.textContent = "Stimme bereit. Drücke auf Wiedergabe.";




    } catch (error) {
        ttsInfo.textContent = "Fehler: " + error.message;
    } finally {
        ttsButton.disabled = false;
    }
};
const interruptButton = document.createElement("button");
interruptButton.textContent = "Neuen Sprachbefehl testen";




const interruptInfo = document.createElement("p");
document.body.append(interruptButton, interruptInfo);




interruptButton.onclick = async () => {
    if (!ttsURL || !stream?.getAudioTracks().some(t => t.readyState === "live")) {
        interruptInfo.textContent = "Bitte Mikrofon starten und Stimme erzeugen.";
        return;
    }




    const code = localStorage.getItem("jarvis_access_code") ||
        prompt("JARVIS-Zugangscode:");




    if (!code) return;




    interruptButton.disabled = true;




    let timer;
    let recorder;
    let loudSince = 0;
    let quietSince = 0;
    let recordingSince = 0;
    let chunks = [];




    function finish(message) {
        clearInterval(timer);
        ttsPlayer.pause();
        interruptButton.disabled = false;
        interruptInfo.textContent = message;
    }




    async function recognize(blob) {
        interruptInfo.textContent = "Verarbeite Sprachbefehl...";




        try {
            const ext = blob.type.includes("webm") ? "webm" :
                blob.type.includes("ogg") ? "ogg" :
                blob.type.includes("wav") ? "wav" : "m4a";




            const form = new FormData();
            form.append("file", blob, "aufnahme." + ext);




            const result = await fetch(
                "https://jarvis-api.filippoantonioallatta.workers.dev/transcribe",
                {
                    method: "POST",
                    headers: {
                        "X-Jarvis-Code": code.trim()
                    },
                    body: form,
                    signal: AbortSignal.timeout(45000)
                }
            );




            const data = await result.json();




            if (!result.ok) {
                throw new Error(data.error || "HTTP " + result.status);
            }




            const text = String(data.text || "").trim();




            if (text) {
                finish("Neuer Sprachbefehl: " + text);
                return;
            }




            await ttsPlayer.play();
            interruptButton.disabled = false;
            interruptInfo.textContent = "Keine Sprache erkannt. Wiedergabe läuft weiter.";




        } catch (error) {
            finish("Fehler: " + error.message);
        }
    }




    try {
        ttsPlayer.currentTime = 0;
        await ttsPlayer.play();




        interruptInfo.textContent = "Sprich während der Wiedergabe dazwischen.";




        timer = setInterval(() => {
            const now = performance.now();
            const loud = level.value >= 15;




            if (recorder?.state === "recording") {
                quietSince = loud ? 0 : (quietSince || now);




                if ((quietSince && now - quietSince >= 1200) ||
                    now - recordingSince >= 15000 ||
                    !stream.getAudioTracks().some(t => t.readyState === "live")) {
                    clearInterval(timer);
                    recorder.stop();
                }




                return;
            }




            if (ttsPlayer.ended ||
                !stream.getAudioTracks().some(t => t.readyState === "live")) {
                finish("Test beendet.");
                return;
            }




            loudSince = loud ? (loudSince || now) : 0;




            if (loudSince && now - loudSince >= 150) {
                try {
                    recorder = new MediaRecorder(stream);




                    recorder.ondataavailable = e => {
                        if (e.data.size) chunks.push(e.data);
                    };




                    recorder.onstop = () => {
                        if (!chunks.length) {
                            finish("Keine Aufnahme erhalten.");
                            return;
                        }




                        recognize(new Blob(chunks, {
                            type: recorder.mimeType || chunks[0].type
                        }));
                    };




                    ttsPlayer.pause();
                    recorder.start();
                    recordingSince = now;




                    interruptInfo.textContent =
                        "PAUSE – neuer Sprachbefehl wird aufgenommen.";




                } catch (error) {
                    finish(error.message);
                }
            }
        }, 50);




    } catch (error) {
        finish(error.message);
    }
};
</script>

</body>
</html>
